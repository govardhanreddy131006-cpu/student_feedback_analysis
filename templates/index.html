{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm p-4 mb-5">
    <h2 class="mb-3">Course Feedback Form</h2>
    <form action="/submit" method="POST">
        <!-- Course Selection Dropdown -->
        <div class="mb-4">
            <label class="form-label fw-bold">Select Course:</label>
            <select name="course_id" class="form-select" required>
                <option value="">-- Choose Course --</option>
                {% for course in courses %}
                    <option value="{{ course.course_id }}">{{ course.course_code }} - {{ course.course_name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Dynamic Questions Grouped by Section -->
        {% for section_name, questions in sections.items() %}
            <h5 class="text-primary mt-4 border-bottom pb-2">{{ section_name }}</h5>
            {% for q in questions %}
                <div class="mb-3">
                    <label class="form-label fw-bold">{{ q.question_text }}</label>
                    <div class="d-flex gap-3">
                        {% for i in range(1, 6) %}
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="question_{{ q.question_id }}" value="{{ i }}" id="q_{{ q.question_id }}_{{ i }}" required>
                                <label class="form-check-label" for="q_{{ q.question_id }}_{{ i }}">{{ i }}★</label>
                            </div>
                        {% endfor %}
                    </div>
                </div>
            {% endfor %}
        {% endfor %}

        <!-- Optional Comments -->
        <div class="mb-3 mt-4">
            <label class="form-label fw-bold">Optional Comments:</label>
            <textarea name="comment" class="form-control" rows="3" placeholder="Share any extra suggestions..."></textarea>
        </div>

        <button type="submit" class="btn btn-success btn-lg w-100 mt-3">Submit Feedback</button>
    </form>
</div>
{% endblock %}
